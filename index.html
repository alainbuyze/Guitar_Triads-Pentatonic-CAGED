<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triads → Pentatonic Boxes → CAGED — Fretboard Explorer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;padding:16px;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto}
h1{text-align:center;font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#fbbf24,#22d3ee);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:#94a3b8;font-size:.82rem;margin:2px 0 16px}
.sub b{color:#22d3ee}
.section{background:#1e293b;border-radius:12px;padding:16px;margin-bottom:14px;border:1px solid #334155}
.sec-title{font-size:.72rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.09em;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.sec-title::before{content:'';width:3px;height:14px;background:#22d3ee;border-radius:2px}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ctrls .lab{font-size:.74rem;color:#ffffff;font-weight:700;margin-right:2px;min-width:72px}
.ctrls .grp{display:inline-flex;align-items:center;gap:6px}
.ctrls button.btn{padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:700;cursor:pointer;border:2px solid #475569;background:transparent;color:#cbd5e1;transition:all .15s}
.ctrls button.btn.on{border-color:#22c55e;background:rgba(34,197,94,.14);color:#22c55e}
.ctrls button.btn.mini{padding:4px 9px;font-size:.72rem}
.ctrls button.btn.root{padding:4px 0;width:34px;text-align:center}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:2px solid #475569;border-radius:20px;overflow:hidden}
.seg button.btn{border:none;border-radius:0;margin:0}
.fbwrap{overflow-x:auto}
svg{display:block}
.tri-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.tc{background:#0f172a;border-radius:10px;padding:12px;border-left:4px solid;cursor:pointer;transition:all .18s}
.tc:hover{transform:translateY(-2px)}
.tc.dim{opacity:.4}
.tc h4{font-size:.82rem;font-weight:800;margin-bottom:3px}
.tc .meta{font-size:.7rem;color:#94a3b8;line-height:1.5}
.tc .tag{display:inline-block;font-size:.62rem;font-weight:700;padding:1px 7px;border-radius:10px;margin-top:6px;margin-right:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.li{display:flex;align-items:center;gap:5px;font-size:.7rem;color:#94a3b8}
.ld{width:11px;height:11px;border-radius:50%}
.note{font-size:.74rem;color:#94a3b8;line-height:1.6;margin-top:10px}
.note b{color:#e2e8f0}
.hint{text-align:center;color:#64748b;font-size:.68rem;margin-top:6px}
.tc .play{display:block;margin-top:8px;padding:4px 12px;border-radius:14px;font-size:.7rem;font-weight:700;border:1.5px solid currentColor;background:transparent;cursor:pointer}
.tc .play:hover{filter:brightness(1.3)}
#chordPlayWrap{text-align:center;margin-top:10px}
#chordPlayWrap .play{padding:6px 18px;font-size:.78rem;font-weight:800;border:2px solid currentColor;border-radius:20px;background:transparent;cursor:pointer}
#chordPlayWrap .play:hover{filter:brightness(1.3)}
.note-dot{cursor:pointer}
footer{text-align:center;color:#475569;font-size:.7rem;margin:18px 0 4px}
footer a{color:#64748b}
</style>
</head>
<body>
<div class="wrap">
<h1>Triads → Pentatonic Boxes → CAGED</h1>
<p class="sub" id="sub"></p>

<div class="section">
  <div class="ctrls" id="rootRow"><span class="lab">ROOT:</span></div>
  <div class="ctrls">
    <span class="lab">QUALITY:</span>
    <span class="seg">
      <button class="btn mini on" data-q="minor">minor</button>
      <button class="btn mini" data-q="major">major</button>
      <button class="btn mini" data-q="sus2">sus2</button>
      <button class="btn mini" data-q="sus4">sus4</button>
      <button class="btn mini" data-q="aug">aug</button>
      <button class="btn mini" data-q="dim">dim</button>
      <button class="btn mini" data-q="maj7">maj7</button>
      <button class="btn mini" data-q="dom7">dom7</button>
      <button class="btn mini" data-q="min7">min7</button>
    </span>
  </div>
  <div class="ctrls">
    <span class="lab">STRING-SET:</span>
    <button class="btn on" data-set="top">Top 3 (G-B-e)</button>
    <button class="btn" data-set="mid">Middle 3 (D-G-B)</button>
    <button class="btn" data-set="s3">A-D-G</button>
    <button class="btn" data-set="low">Low 3 (E-A-D)</button>
  </div>
  <div class="ctrls">
    <span class="lab">SHOW:</span>
    <button class="btn mini on" data-t="penta">Pentatonic</button>
    <button class="btn mini on" data-t="caged">CAGED zones</button>
    <button class="btn mini on" data-t="box">Box outline</button>
    <button class="btn mini on" data-t="chord">Full chord</button>
  </div>
  <div class="ctrls">
    <span class="grp"><span class="lab">LABELS:</span>
    <span class="seg">
      <button class="btn mini" data-lm="none">•</button>
      <button class="btn mini" data-lm="deg">Degrees</button>
      <button class="btn mini on" data-lm="note">Notes</button>
    </span></span>
    <span class="grp"><span class="lab">NOTES:</span>
    <span class="seg">
      <button class="btn mini on" data-acc="sharp">Sharps ♯</button>
      <button class="btn mini" data-acc="flat">Flats ♭</button>
    </span></span>
  </div>
  <div class="ctrls">
    <span class="lab">SOUND:</span>
    <button class="btn mini on" id="soundBtn">On</button>
  </div>
  <div class="fbwrap"><svg id="fb"></svg></div>
  <p class="hint">Click any note on the fretboard to hear it</p>
  <div class="legend">
    <div class="li"><div class="ld" style="background:#fbbf24"></div>Root position</div>
    <div class="li"><div class="ld" style="background:#22c55e"></div>1st inversion</div>
    <div class="li"><div class="ld" style="background:#38bdf8"></div>2nd inversion</div>
    <div class="li"><div class="ld" style="border:2px solid #ef4444;background:transparent"></div>Root note</div>
    <div class="li"><div class="ld" style="background:#475569"></div>Pentatonic note</div>
  </div>
  <div id="chordPlayWrap"></div>
  <div class="tri-cards" id="cards"></div>
</div>

<div class="section">
  <div class="sec-title">The Connection</div>
  <div class="note" id="explain"></div>
</div>

<footer>Interactive fretboard theory explorer · single self-contained HTML file</footer>
</div>

<script>
const OPEN=[4,9,2,7,11,4];
const OPEN_MIDI=[40,45,50,55,59,64];
const SNAMES=['E','A','D','G','B','e'];
const NOTE=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_FLAT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
function noteName(pc){ return (ST.acc==='flat'?NOTE_FLAT:NOTE)[((pc%12)+12)%12]; }
const SHAPE={1:'E shape',2:'D shape',3:'C shape',4:'A shape',5:'G shape'};
const SHAPECOL={'A shape':'#a78bfa','G shape':'#2dd4bf','E shape':'#f43f5e','D shape':'#f59e0b','C shape':'#38bdf8'};
const IC={Root:'#fbbf24','1st':'#22c55e','2nd':'#38bdf8'};
const SETSTR={top:[3,4,5],mid:[2,3,4],s3:[1,2,3],low:[0,1,2]};
const SETNAME={top:'Top 3 strings (G-B-e)',mid:'Middle 3 strings (D-G-B)',s3:'A-D-G strings',low:'Low 3 strings (E-A-D)'};
const TRIADIV={minor:[0,3,7],major:[0,4,7],aug:[0,4,8],dim:[0,3,6],sus2:[0,2,7],sus4:[0,5,7],maj7:[0,4,11],dom7:[0,4,10],min7:[0,3,10]};
const DEGNAME={minor:{0:'1',3:'b3',5:'4',7:'5',10:'b7'},major:{0:'1',2:'2',4:'3',7:'5',9:'6'},aug:{0:'1',4:'3',8:'#5'},dim:{0:'1',3:'b3',6:'b5'},maj7:{0:'1',4:'3',11:'7'},dom7:{0:'1',4:'3',10:'b7'}};
DEGNAME.sus2=DEGNAME.major; DEGNAME.sus4=DEGNAME.minor; DEGNAME.min7=DEGNAME.minor;
const QNAME={minor:'minor',major:'major',aug:'augmented',dim:'diminished',sus2:'sus2',sus4:'sus4',maj7:'maj7',dom7:'dom7',min7:'min7'};
// qualities whose 3 notes are a full subset of the (major or minor) pentatonic scale get the box/CAGED overlay
function hasCagedFramework(q){return q==='minor'||q==='major'||q==='sus2'||q==='sus4'||q==='min7';}
// qualities anchored directly on the minor pentatonic at their own root (no relative-minor detour needed)
function directMinorAnchor(q){return q==='minor'||q==='sus4'||q==='min7';}

function penta(q){return (q==='minor'||q==='dim'||q==='sus4'||q==='min7')?[0,3,5,7,10]:[0,2,4,7,9];}
function triadiv(q){return TRIADIV[q];}
function ivl(s,f,R){return ((OPEN[s]+f-R)%12+12)%12;}
function isPentaG(s,f,R,q){return penta(q).includes(ivl(s,f,R));}
function minorRootOf(R,q){return directMinorAnchor(q)?R:((R-3)%12+12)%12;}

function boxCopies(N,R,q){
  const P=penta(q), anchorIv=P[(N-1)%5], out=[];
  for(let A=-12;A<=20;A++){
    if(ivl(0,A,R)!==anchorIv) continue;
    const pcs=[]; let all=[];
    for(let s=0;s<6;s++){
      const fr=[]; for(let f=0;f<=20;f++){ if(isPentaG(s,f,R,q)&&f>=A-1&&f<=A+3) fr.push(f); }
      pcs.push(fr); all=all.concat(fr);
    }
    if(!all.length) continue;
    out.push({N,A,pcs,lo:Math.min(...all),hi:Math.max(...all)});
  }
  return out;
}
function allCopies(R,q){let o=[];for(let N=1;N<=5;N++)o=o.concat(boxCopies(N,R,q));return o;}

function whichBox(tri,copies){
  const hits=[];
  for(const cp of copies){
    if(tri.every(([s,f])=>cp.pcs[s].includes(f))) hits.push({N:cp.N,center:(cp.lo+cp.hi)/2,lo:cp.lo,hi:cp.hi});
  }
  return hits;
}
function pickBox(tri,copies){
  const h=whichBox(tri,copies); if(!h.length) return null;
  const c=tri.reduce((a,n)=>a+n[1],0)/tri.length;
  // a genuine (unclipped) pentatonic box always spans 3-4 frets; anything narrower is a sliver
  // left over from a box anchored off the edge of the neck, not a real candidate shape
  const full=h.filter(x=>(x.hi-x.lo)>=3);
  const pool=full.length?full:h;
  pool.sort((x,y)=>(Math.abs(x.center-c)-Math.abs(y.center-c))||(x.N-y.N));
  return pool[0];
}
function enumTriads(setKey,R,q){
  const strs=SETSTR[setKey], ti=triadiv(q).map(x=>(R+x)%12), ts=[...ti].sort((a,b)=>a-b);
  const invMap={}; invMap[ti[0]]='Root';invMap[ti[1]]='1st';invMap[ti[2]]='2nd';
  const majC=allCopies(R,q), mR=minorRootOf(R,q), minC=directMinorAnchor(q)?majC:allCopies(mR,'minor');
  const out=[];
  for(let a=0;a<16;a++)for(let b=0;b<16;b++)for(let c=0;c<16;c++){
    const combo=[a,b,c], pcs=combo.map((f,i)=>(OPEN[strs[i]]+f)%12), ps=[...pcs].sort((x,y)=>x-y);
    if(ps[0]!==ts[0]||ps[1]!==ts[1]||ps[2]!==ts[2])continue;
    if(Math.max(a,b,c)-Math.min(a,b,c)>4)continue;
    const tri=combo.map((f,i)=>[strs[i],f]);
    const maj=pickBox(tri,majC), mn=pickBox(tri,minC);
    const shapeBox=maj?maj.N:null;
    const label=strs.map((s,i)=>noteName(OPEN[s]+combo[i])).join('-');
    out.push({notes:tri,inv:invMap[pcs[0]],color:IC[invMap[pcs[0]]],box:mn?mn.N:null,shapeBox,zone:shapeBox?SHAPE[shapeBox]:'?',bw:maj?[maj.lo,maj.hi]:null,label,frets:combo});
  }
  // wide-interval qualities (sus2/sus4/shells) can find two compact arrangements that share
  // the same bass note, differing only in which upper note sits on top; keep just the tighter one
  const bestByBass=new Map();
  for(const t of out){
    const key=t.inv+'|'+t.frets[0], span=Math.max(...t.frets)-Math.min(...t.frets);
    if(!bestByBass.has(key) || span<bestByBass.get(key).span) bestByBass.set(key,{t,span});
  }
  const deduped=[...bestByBass.values()].map(v=>v.t);
  deduped.sort((x,y)=>x.frets[0]-y.frets[0]||x.frets[1]-y.frets[1]);
  return deduped;
}

let ST={root:9,q:'minor',set:'top',sel:null,lm:'note',acc:'sharp',show:{penta:true,caged:true,box:true,chord:true}};

const LP=58,FW=52,SH=30,FRETS=15;
let TP=66;
function xf(f){return f===0?(LP-16):(LP+(f-0.5)*FW);}
function yr(row){return TP+row*SH;}
function s2row(si){return 5-si;}
function spanX(a,b){return [Math.max(LP-32, LP+(a-1)*FW), LP+b*FW];}
function isRoot(s,f){return ivl(s,f,ST.root)===0;}
function isPenta(s,f){return penta(ST.q).includes(ivl(s,f,ST.root));}
function inLabel(s,f){ if(ST.lm==='none')return ''; if(ST.lm==='deg')return DEGNAME[ST.q][ivl(s,f,ST.root)]||''; return noteName(OPEN[s]+f); }

const Synth=(()=>{
  let ctx=null,muted=false;
  function ensure(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); return ctx; }
  function karplus(freq,dur,sr){
    const N=Math.max(2,Math.round(sr/freq)),total=Math.round(dur*sr);
    const buf=new Float32Array(total),ring=new Float32Array(N),raw=new Float32Array(N);
    for(let i=0;i<N;i++) raw[i]=Math.random()*2-1;
    // smooth the excitation burst (fingertip-on-nylon attack instead of a bright pick click)
    for(let i=0;i<N;i++) ring[i]=(raw[i]+raw[(i+1)%N]+raw[(i+2)%N])/3;
    let idx=0;
    const decay=0.9965; // longer, mellower sustain
    for(let i=0;i<total;i++){
      const nv=(ring[idx]+ring[(idx+1)%N])*0.5*decay;
      buf[i]=ring[idx]; ring[idx]=nv; idx=(idx+1)%N;
    }
    return buf;
  }
  function pluck(freq,when=0,gainVal=0.35){
    if(muted) return;
    const c=ensure(),dur=1.9,data=karplus(freq,dur,c.sampleRate);
    const buffer=c.createBuffer(1,data.length,c.sampleRate);
    buffer.copyToChannel(data,0);
    const src=c.createBufferSource(); src.buffer=buffer;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3200; lp.Q.value=0.6;
    const body=c.createBiquadFilter(); body.type='peaking'; body.frequency.value=160; body.Q.value=1; body.gain.value=4;
    const gain=c.createGain(),t0=c.currentTime+when;
    gain.gain.setValueAtTime(gainVal,t0);
    gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(lp).connect(body).connect(gain).connect(c.destination);
    src.start(t0); src.stop(t0+dur+0.05);
  }
  function strum(freqs,stagger=0.11){ freqs.forEach((f,i)=>pluck(f,i*stagger)); }
  function toggleMute(){ muted=!muted; return muted; }
  return {pluck,strum,toggleMute,isMuted:()=>muted};
})();
function freqOf(s,f){ return 440*Math.pow(2,(OPEN_MIDI[s]+f-69)/12); }
function flashDot(s,f){
  const svg=document.getElementById('fb');
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',xf(f)); c.setAttribute('cy',yr(s2row(s)));
  c.setAttribute('fill','none'); c.setAttribute('stroke','#ffffff'); c.setAttribute('stroke-width','2'); c.setAttribute('pointer-events','none');
  svg.appendChild(c);
  const t0=performance.now();
  function step(t){
    const dt=(t-t0)/380;
    if(dt>=1||!c.isConnected){ if(c.parentNode) c.parentNode.removeChild(c); return; }
    c.setAttribute('r',11+dt*11);
    c.setAttribute('opacity',(0.9*(1-dt)).toFixed(2));
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function playNote(s,f){ Synth.pluck(freqOf(s,f)); flashDot(s,f); }
function dot(x,y,r,fill,txt,txtcol,root,op,s,f){
  let g=`<circle cx="${x}" cy="${y}" r="${Math.max(r+5,15)}" fill="transparent" class="note-dot" data-s="${s}" data-f="${f}"/>`;
  g+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" opacity="${op}" class="note-dot" data-s="${s}" data-f="${f}"/>`;
  if(root) g+=`<circle cx="${x}" cy="${y}" r="${r+2.5}" fill="none" stroke="#ef4444" stroke-width="2.2" opacity="${op}" pointer-events="none"/>`;
  if(txt) g+=`<text x="${x}" y="${y+3}" text-anchor="middle" font-size="${txt.length>1?7.5:8.5}" font-weight="800" fill="${txtcol}" opacity="${op}" pointer-events="none">${txt}</text>`;
  return g;
}
function fullChord(tri){
  const map={};tri.notes.forEach(([s,f])=>map[s]=f);
  // borrow notes from any other string-set's triad that lands in this exact same box (same
  // shape, same fret window) -- guarantees the full chord agrees with the app's own triads
  // instead of independently guessing, so adjacent string-sets always tell the same story
  const borrowed={};
  for(const setKey of ['top','mid','s3','low']){
    for(const o of enumTriads(setKey,ST.root,ST.q)){
      if(o.shapeBox===tri.shapeBox && o.bw && o.bw[0]===tri.bw[0] && o.bw[1]===tri.bw[1]){
        o.notes.forEach(([s,f])=>{ if(!(s in map) && !(s in borrowed)) borrowed[s]=f; });
      }
    }
  }
  const ct=triadiv(ST.q).map(x=>(ST.root+x)%12);
  const center=tri.notes.reduce((a,n)=>a+n[1],0)/tri.notes.length, rep=[];
  for(let s=0;s<6;s++){
    if(s in map){rep.push([s,map[s],true]);continue;}
    if(s in borrowed){rep.push([s,borrowed[s],false]);continue;}
    let best=null;
    for(let f=tri.bw[0];f<=tri.bw[1];f++){ if(ct.includes((OPEN[s]+f)%12)){ if(best===null||Math.abs(f-center)<Math.abs(best-center)) best=f; } }
    if(best!==null) rep.push([s,best,false]);
  }
  return rep;
}

let TRIS=[];
function render(){
  TRIS=enumTriads(ST.set,ST.root,ST.q);
  if(ST.sel!==null && ST.sel>=TRIS.length) ST.sel=null;

  let bars=allCopies(ST.root,ST.q)
    .filter(cp=>cp.lo<=15 && (cp.hi-cp.lo)>=2)
    .map(cp=>({N:cp.N,lo:cp.lo,hi:Math.min(cp.hi,15),label:SHAPE[cp.N],color:SHAPECOL[SHAPE[cp.N]]}))
    .sort((x,y)=>x.lo-y.lo);
  const rowsEnd=[];
  bars.forEach(bar=>{let r=0;while(rowsEnd[r]!==undefined&&bar.lo<=rowsEnd[r])r++;rowsEnd[r]=bar.hi;bar.row=r;});
  const maxRow=bars.reduce((m,b)=>Math.max(m,b.row),0);
  const barsOn=ST.show.caged && hasCagedFramework(ST.q);
  TP = barsOn ? (16+(maxRow+1)*16+12) : 30;

  const selShape = ST.sel!==null?TRIS[ST.sel].shapeBox:null;
  const selCen = ST.sel!==null&&TRIS[ST.sel].bw?(TRIS[ST.sel].bw[0]+TRIS[ST.sel].bw[1])/2:-99;

  document.getElementById('sub').innerHTML=`Where the shapes live on the neck — <b>${noteName(ST.root)} ${QNAME[ST.q]}</b> · pick any root &amp; quality; slide the shapes for other keys`;
  const svg=document.getElementById('fb');
  const W=LP+FRETS*FW+24, H=TP+5*SH+40;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width',W);svg.setAttribute('height',H);
  let s='';

  if(barsOn){
    bars.forEach(bar=>{
      const y=14+bar.row*16, [x1,x2]=spanX(bar.lo,bar.hi);
      const act=ST.sel===null||(bar.N===selShape && bar.lo<=selCen && selCen<=bar.hi);
      const op=act?0.92:0.3, top=act?1:0.55;
      s+=`<rect x="${x1}" y="${y}" width="${x2-x1}" height="12" rx="5" fill="${bar.color}" opacity="${op}"/>`;
      s+=`<text x="${(x1+x2)/2}" y="${y+9}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#ffffff" opacity="${top}" style="paint-order:stroke" stroke="#0f172a" stroke-width="0.7">${bar.label}</text>`;
    });
  }
  for(const mf of[3,5,7,9,12,15]){
    const mx=LP+(mf-0.5)*FW;
    if(mf===12){s+=`<circle cx="${mx}" cy="${yr(1.5)}" r="4" fill="#334155"/><circle cx="${mx}" cy="${yr(3.5)}" r="4" fill="#334155"/>`;}
    else{s+=`<circle cx="${mx}" cy="${yr(2.5)}" r="5" fill="#1e293b" stroke="#334155"/>`;}
  }
  for(let f=0;f<=FRETS;f++){
    const mx=f===0?(LP-16):LP+(f-0.5)*FW,big=[0,3,5,7,9,12,15].includes(f);
    s+=`<text x="${mx}" y="${H-8}" text-anchor="middle" font-size="${big?13:10}" font-weight="${big?800:600}" fill="${big?'#e2e8f0':'#64748b'}">${f}</text>`;
  }
  for(let r=0;r<6;r++){
    const y=yr(r);
    s+=`<line x1="${LP}" y1="${y}" x2="${LP+FRETS*FW}" y2="${y}" stroke="#475569" stroke-width="${0.5+r*0.25}"/>`;
    s+=`<text x="${LP-38}" y="${y+4}" text-anchor="end" font-size="12" fill="#94a3b8" font-weight="700">${SNAMES[5-r]}</text>`;
  }
  s+=`<rect x="${LP-4}" y="${TP-6}" width="5" height="${5*SH+12}" fill="#d97706" rx="1"/>`;
  for(let f=1;f<=FRETS;f++){const x=LP+f*FW;s+=`<line x1="${x}" y1="${TP-6}" x2="${x}" y2="${TP+5*SH+6}" stroke="#334155" stroke-width="1.5"/>`;}

  if(ST.show.penta && hasCagedFramework(ST.q)){
    for(let si=0;si<6;si++)for(let f=0;f<=FRETS;f++){
      if(!isPenta(si,f))continue;
      s+=dot(xf(f),yr(s2row(si)),ST.lm==='none'?7:9,'#334155',inLabel(si,f),'#cbd5e1',isRoot(si,f),0.9,si,f);
    }
  }
  if(ST.show.box && ST.sel!==null && TRIS[ST.sel].bw){
    const t=TRIS[ST.sel],lf=t.bw[0],rf=t.bw[1];
    const x1=(lf<=0)?(LP-32):(LP+(lf-1)*FW+3),x2=LP+rf*FW-2;
    s+=`<rect x="${x1}" y="${TP-12}" width="${x2-x1}" height="${5*SH+24}" rx="8" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,4" opacity=".8"/>`;
    s+=`<text x="${(x1+x2)/2}" y="${TP+5*SH+22}" text-anchor="middle" font-size="10" font-weight="700" fill="#e2e8f0">Box ${t.box||'?'}</text>`;
  }
  if(ST.show.chord && ST.sel!==null && TRIS[ST.sel].bw){
    const t=TRIS[ST.sel],rep=fullChord(t),pts=rep.map(([si,f])=>[xf(f),yr(s2row(si))]);
    s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${t.color}" stroke-width="1.6" stroke-dasharray="3,4" opacity=".7"/>`;
    rep.forEach(([si,f,isTri])=>{ if(isTri)return; s+=dot(xf(f),yr(s2row(si)),9,t.color,inLabel(si,f),'#0f172a',isRoot(si,f),0.32,si,f); });
  }
  TRIS.forEach((t,i)=>{
    const active=ST.sel===null||ST.sel===i,op=active?1:0.14;
    const pts=t.notes.map(([si,f])=>[xf(f),yr(s2row(si))]);
    for(let k=0;k<pts.length-1;k++)
      s+=`<line x1="${pts[k][0]}" y1="${pts[k][1]}" x2="${pts[k+1][0]}" y2="${pts[k+1][1]}" stroke="${t.color}" stroke-width="2.4" opacity="${op*0.55}"/>`;
    t.notes.forEach(([si,f])=>{ s+=dot(xf(f),yr(s2row(si)),11,t.color,inLabel(si,f),'#0f172a',isRoot(si,f),op,si,f); });
  });

  svg.innerHTML=s;
  renderCards();renderExplain();updateChordPlay();
}

function updateChordPlay(){
  const w=document.getElementById('chordPlayWrap');
  if(ST.sel!==null && ST.show.chord && TRIS[ST.sel] && TRIS[ST.sel].bw){
    const t=TRIS[ST.sel];
    w.innerHTML=`<button class="play" style="color:${t.color}" id="playChordBtn">Play full chord</button>`;
    document.getElementById('playChordBtn').addEventListener('click',()=>{
      Synth.strum(fullChord(t).map(([si,f])=>freqOf(si,f)));
    });
  } else w.innerHTML='';
}

function renderCards(){
  const c=document.getElementById('cards');
  c.innerHTML=TRIS.map((t,i)=>{
    const dim=ST.sel!==null&&ST.sel!==i?'dim':'';
    return `<div class="tc ${dim}" style="border-color:${t.color}" data-i="${i}">
      <h4 style="color:${t.color}">${t.inv} inversion</h4>
      <div class="meta">${t.label} · frets ${t.frets.join('-')}</div>
      ${hasCagedFramework(ST.q)?`<span class="tag" style="background:${t.color}22;color:${t.color}">${t.box?'Box '+t.box:'—'}</span>
      <span class="tag" style="background:#475569;color:#cbd5e1">${t.zone}</span>`:''}
      <button class="play" style="color:${t.color}" data-play="${i}">Play</button>
    </div>`;
  }).join('');
  c.querySelectorAll('.tc').forEach(el=>el.addEventListener('click',()=>{const i=+el.dataset.i;ST.sel=ST.sel===i?null:i;render();}));
  c.querySelectorAll('[data-play]').forEach(btn=>btn.addEventListener('click',e=>{
    e.stopPropagation();
    const i=+btn.dataset.play;
    Synth.strum(TRIS[i].notes.map(([si,f])=>freqOf(si,f)));
  }));
}
function renderExplain(){
  const rn=noteName(ST.root), qn=QNAME[ST.q];
  const isShell = ST.q==='maj7'||ST.q==='dom7'||ST.q==='min7';
  const notesStr = triadiv(ST.q).map(x=>noteName(ST.root+x)).join('-');
  if(!hasCagedFramework(ST.q)){
    let note;
    if(ST.q==='aug') note = `Its three notes (${notesStr}) are stacked in equal major thirds, so the shape is perfectly symmetrical — the same shape repeats every 4 frets for a different augmented triad.`;
    else if(ST.q==='dim') note = `Its three notes (${notesStr}) stack a minor third and another minor third.`;
    else note = `This is a <b>shell voicing</b>: a stripped-down 7th chord using only the root, 3rd, and 7th (${notesStr}) — the 5th is dropped since it adds little to the chord's identity. Shells are the guide-tone voicings jazz and blues players use for compact, mobile comping, usually low on the neck.`;
    const label = isShell ? `${qn} shells` : `${qn} triads`;
    document.getElementById('explain').innerHTML=
      `<b>${rn} ${qn} · ${SETNAME[ST.set]}.</b> ${label[0].toUpperCase()+label.slice(1)} don't have a standard open-chord CAGED shape or a matching pentatonic scale the way major and minor do, so the pentatonic/CAGED overlay is hidden here. ${note}
      <br><br>
      <b>Click a triad</b> to isolate it, or hit <b>Play</b> on any card to hear it. Red rings mark the <b>root</b>; toggle <b>Labels</b> for scale degrees or note names.`;
    return;
  }
  const majNote = (ST.q==='major'||ST.q==='sus2') ? `<br><br><b>${ST.q==='sus2'?'Sus2':'Major'}-key note:</b> the pentatonic box number is counted from the shared pentatonic shape (the relative minor, ${noteName(minorRootOf(ST.root,'major'))} minor), so boxes stay the same as that minor key. The CAGED <b>shape</b> follows the actual ${rn} ${qn} chord — so here, box number and shape sit one position apart (e.g. the E-shape barre lives in box 2).` : '';
  const shellNote = ST.q==='min7' ? `<br><br><b>Shell-voicing note:</b> this is a stripped-down 7th chord (root-b3-b7, the 5th omitted) rather than a full triad — but its notes are a subset of the minor pentatonic, so it sits inside the same boxes and shapes as an ordinary minor chord.` : '';
  const chordWord = isShell ? 'shell voicing' : `${qn} triad`;
  document.getElementById('explain').innerHTML=
    `<b>${rn} ${qn} · ${SETNAME[ST.set]}.</b> The five CAGED bars up top show every shape across the neck. Change ROOT or QUALITY and the whole system recomputes for that key.
    <br><br>
    <b>Click a triad</b> to isolate it: its CAGED bar brightens, the dashed box shows its pentatonic position, and the dotted line traces the <b>full chord</b> (every chord tone in that box across all six strings). Red rings mark the <b>root</b>. Toggle <b>Labels</b> for scale degrees or note names. The ${chordWord} (${notesStr}) is the skeleton; the pentatonic wraps two extra tones around it.${majNote}${shellNote}`;
}

const rr=document.getElementById('rootRow');
for(let i=0;i<12;i++){
  const b=document.createElement('button');
  b.className='btn mini root'+(i===9?' on':''); b.dataset.root=i; b.textContent=noteName(i);
  b.addEventListener('click',()=>{ST.root=i;ST.sel=null;rr.querySelectorAll('[data-root]').forEach(x=>x.classList.toggle('on',x===b));render();});
  rr.appendChild(b);
}
function refreshRootLabels(){ rr.querySelectorAll('[data-root]').forEach(b=>{ b.textContent=noteName(+b.dataset.root); }); }
document.querySelectorAll('[data-acc]').forEach(b=>b.addEventListener('click',()=>{
  ST.acc=b.dataset.acc;
  document.querySelectorAll('[data-acc]').forEach(x=>x.classList.toggle('on',x===b));
  refreshRootLabels();
  render();
}));
document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{ST.q=b.dataset.q;ST.sel=null;document.querySelectorAll('[data-q]').forEach(x=>x.classList.toggle('on',x===b));render();}));
document.querySelectorAll('[data-set]').forEach(b=>b.addEventListener('click',()=>{ST.set=b.dataset.set;ST.sel=null;document.querySelectorAll('[data-set]').forEach(x=>x.classList.toggle('on',x===b));render();}));
document.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.t;ST.show[t]=!ST.show[t];b.classList.toggle('on');render();}));
document.querySelectorAll('[data-lm]').forEach(b=>b.addEventListener('click',()=>{ST.lm=b.dataset.lm;document.querySelectorAll('[data-lm]').forEach(x=>x.classList.toggle('on',x===b));render();}));
document.getElementById('soundBtn').addEventListener('click',function(){
  const m=Synth.toggleMute();
  this.textContent=m?'Off':'On';
  this.classList.toggle('on',!m);
});
document.getElementById('fb').addEventListener('click',e=>{
  const t=e.target;
  if(t.classList && t.classList.contains('note-dot')) playNote(+t.dataset.s,+t.dataset.f);
});
render();
</script>
</body>
